baseURL = 'https://yuzhou-1003.github.io/'
languageCode = 'zh-cn'
title = "Yuzhou's Notes"
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true
[pagination]
pagerSize = 8
[params]
author = 'Yuzhou'
description = '记录技术、学习与思考。'
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
mainSections = ['posts']
[params.homeInfoParams]
Title = '👋 欢迎来到我的博客'
Content = '这里记录技术实践、学习笔记和一些思考。'
[[params.socialIcons]]
name = 'github'
url = 'https://github.com/yuzhou-1003'
[outputs]
home = ['HTML', 'RSS', 'JSON']
[menu]
[[menu.main]]
identifier = 'posts'
name = '文章'
url = '/posts/'
weight = 10
[[menu.main]]
identifier = 'archive'
name = '归档'
url = '/archives/'
weight = 20
[[menu.main]]
identifier = 'tags'
name = '标签'
url = '/tags/'
weight = 30
[[menu.main]]
identifier = 'search'
name = '搜索'
url = '/search/'
weight = 40
[markup.highlight]
noClasses = false
codeFences = true
lineNos = true
lineNumbersInTable = true
[markup.goldmark.renderer]
unsafe = true
